<!doctype html><meta charset="utf-8"><h1>Hero image checks</h1><pre id="results">RUNNING</pre><iframe id="app" src="/#home" style="width:390px;height:844px;border:0" title="Hero under test"></iframe><script>
const wait=ms=>new Promise(r=>setTimeout(r,ms));app.addEventListener('load',async()=>{await wait(1000);const w=app.contentWindow,d=app.contentDocument,img=d.querySelector('.hero-scene img'),picture=img.parentElement,hero=d.querySelector('.hero'),out=[];for(const width of [390,1440,320]){app.style.width=width+'px';await wait(800);try{await img.decode()}catch{}out.push({width,complete:img.complete,naturalWidth:img.naturalWidth,currentSrc:img.currentSrc,picture:picture.getBoundingClientRect().toJSON(),image:img.getBoundingClientRect().toJSON(),hero:hero.getBoundingClientRect().toJSON(),display:w.getComputedStyle(img).display,z:w.getComputedStyle(picture).zIndex,opacity:w.getComputedStyle(img).opacity,canvas:w.getComputedStyle(d.querySelector('.dot-field-canvas')).opacity})}document.querySelector('#results').textContent=JSON.stringify(out,null,2)},{once:true});
</script>
