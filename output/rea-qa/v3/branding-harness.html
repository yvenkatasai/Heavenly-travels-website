<!doctype html><meta charset="utf-8"><title>Brand reveal checks</title><h1>Brand reveal checks</h1><pre id="results">RUNNING</pre><iframe id="app" src="/" title="Branding under test" style="width:390px;height:844px;border:0"></iframe><script>
const results=[],check=(name,pass,detail='')=>results.push({name,pass:!!pass,detail}),wait=ms=>new Promise(r=>setTimeout(r,ms));
const reload=()=>new Promise(resolve=>{app.addEventListener('load',resolve,{once:true});app.contentWindow.location.reload()});
app.addEventListener('load',async()=>{try{let w=app.contentWindow,d=app.contentDocument,$=s=>d.querySelector(s);const reduced=w.matchMedia('(prefers-reduced-motion: reduce)').matches;
check('Business name is main heading',$('h1').textContent.includes('Heavenly')&&$('h1').textContent.includes('Tours & Travels'));
check('Intro respects motion setting',reduced?$('#brand-intro').hidden:!$('#brand-intro').hidden);
await wait(2750);check('Intro automatically clears',$('#brand-intro').hidden);check('Scrolling unlocked',!d.documentElement.classList.contains('intro-playing'));
for(const width of [320,390,768,1440]){app.style.width=width+'px';await wait(160);const h=$('h1').getBoundingClientRect();check('Hero fits '+width,h.left>=0&&h.right<=w.innerWidth&&d.documentElement.scrollWidth<=w.innerWidth+1,{left:h.left,right:h.right,viewport:w.innerWidth})}
await reload();w=app.contentWindow;d=app.contentDocument;$=s=>d.querySelector(s);check('Returning visit skips intro',$('#brand-intro').hidden);
if(!reduced){w.sessionStorage.removeItem('heavenly-brand-welcome-v1');await reload();w=app.contentWindow;d=app.contentDocument;$=s=>d.querySelector(s);check('Fresh session shows intro',!$('#brand-intro').hidden);$('#skip-intro').click();check('Skip clears intro immediately',$('#brand-intro').hidden&&!d.documentElement.classList.contains('intro-playing'));w.sessionStorage.removeItem('heavenly-brand-welcome-v1');await reload();w=app.contentWindow;d=app.contentDocument;$=s=>d.querySelector(s);d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape'}));check('Escape skips intro',$('#brand-intro').hidden)}
check('Main enquiry works after intro',(()=>{$('[data-contact]').click();const open=$('#contact-dialog').open;$('#contact-close').click();return open})());
}catch(e){check('Checks complete without exception',false,e.stack)}results.push({done:true,passed:results.filter(x=>x.pass).length,failed:results.filter(x=>x.pass===false).length});document.querySelector('#results').textContent=JSON.stringify(results,null,2)},{once:true});
</script>
