<!doctype html><meta charset="utf-8"><title>Dot field checks</title><h1>Dot field checks</h1><pre id="results">RUNNING</pre><iframe id="app" src="/#home" title="Dot field under test" style="width:390px;height:844px;border:0"></iframe><script>
const results=[],check=(name,pass,detail='')=>results.push({name,pass:!!pass,detail}),wait=ms=>new Promise(r=>setTimeout(r,ms));
app.addEventListener('load',async()=>{try{const w=app.contentWindow,d=app.contentDocument,$=s=>d.querySelector(s);await wait(500);const hero=$('[data-dot-field]'),canvas=$('.dot-field-canvas'),stats=()=>hero.dotFieldStats,reduced=w.matchMedia('(prefers-reduced-motion: reduce)').matches;
check('Dot canvas initializes',hero.dataset.dotFieldReady==='true'&&canvas.width>0);check('Business heading preserved',$('h1').textContent.includes('Heavenly'));check('Hero uses one 2D canvas',hero.querySelectorAll('canvas').length===1&&!!canvas.getContext('2d'));
check('Mobile dot budget',stats().dots<2900,stats());check('Mobile DPR capped',stats().dpr<=1.25,stats().dpr);let before=stats().frames;await wait(300);check('Motion preference respected',reduced?stats().frames===before:stats().frames>before,stats());
const fire=(type,x,y,extra={})=>hero.dispatchEvent(new w.PointerEvent(type,{bubbles:true,pointerType:'touch',button:0,clientX:x,clientY:y,cancelable:true,...extra}));
let r=hero.getBoundingClientRect();fire('pointerdown',r.left+70,r.top+120);await wait(150);check('Tap produces a wave',reduced?stats().shocks===0:stats().shocks>0&&stats().offsetMax>0,stats());
const e=new w.PointerEvent('pointermove',{bubbles:true,cancelable:true,pointerType:'touch',button:0,clientX:r.left+170,clientY:r.top+180});hero.dispatchEvent(e);check('Touch scrolling not cancelled',!e.defaultPrevented);fire('pointercancel',0,0);
before=stats().shocks;$('.hero-actions a').dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true,pointerType:'touch',button:0,clientX:r.left+100,clientY:r.top+500}));check('Controls do not produce shockwaves',stats().shocks===before);
for(let i=0;i<12;i++)fire('pointerdown',r.left+30+i*14,r.top+190);check('Shock queue bounded',stats().shocks<=2,stats().shocks);await wait(750);check('Physics stays finite',stats().finite&&stats().offsetMax<500,stats());
check('Frame work sampled',reduced||stats().frames>10,{averageMs:stats().averageFrameMs,maxMs:stats().maxFrameMs,dots:stats().dots});
$('#credits-open').click();$('#motion-toggle').click();$('#credits-close').click();await wait(100);before=stats().frames;await wait(220);check('Pause motion stops frames',stats().frames===before&&!stats().animated,stats());$('#credits-open').click();$('#motion-toggle').click();$('#credits-close').click();await wait(180);
w.scrollTo({top:hero.offsetHeight+1100,behavior:'instant'});await wait(180);before=stats().frames;await wait(240);check('Offscreen field stops frames',stats().frames===before&&!stats().visible,stats());w.scrollTo({top:0,behavior:'instant'});await wait(180);check('Returning to hero resumes correctly',reduced?!stats().animated:stats().animated,stats());
for(const width of [320,390,768,1440]){app.style.width=width+'px';await wait(180);check('No overflow at '+width,d.documentElement.scrollWidth<=w.innerWidth+1);check('Canvas fits hero at '+width,Math.abs(canvas.getBoundingClientRect().width-hero.getBoundingClientRect().width)<1)}
}catch(e){check('Checks complete without exceptions',false,e.stack)}results.push({done:true,passed:results.filter(x=>x.pass).length,failed:results.filter(x=>x.pass===false).length});document.querySelector('#results').textContent=JSON.stringify(results,null,2)},{once:true});
</script>
