<!doctype html><html><head><meta charset="utf-8"><title>Mobile playback check</title></head><body><pre id="results">RUNNING</pre><iframe id="app" src="/index.html" title="Mobile website" style="width:390px;height:844px;border:0"></iframe><script>
const frame=document.querySelector('#app'),sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
frame.addEventListener('load',async()=>{
 try{
  const video=frame.contentDocument.querySelector('#hero-film');
  for(let i=0;i<80&&(video.readyState<3||video.paused);i++)await sleep(100);
  await sleep(1200);
  const start=video.getVideoPlaybackQuality(),time=video.currentTime;
  await sleep(3300);
  const end=video.getVideoPlaybackQuality();
  const sample={width:video.videoWidth,height:video.videoHeight,elapsedVideoSeconds:video.currentTime-time,decodedFrames:end.totalVideoFrames-start.totalVideoFrames,droppedFrames:end.droppedVideoFrames-start.droppedVideoFrames,source:video.currentSrc,paused:video.paused};
  const playbackPassed=sample.width===1920&&sample.height===1080&&sample.elapsedVideoSeconds>2.8&&sample.decodedFrames>=85&&sample.droppedFrames/Math.max(1,sample.decodedFrames)<.05&&!sample.paused;
  const doc=frame.contentDocument,win=frame.contentWindow;
  doc.querySelector('#name').value='Draft QA';doc.querySelector('#pickup').value='Tirupati station';doc.querySelector('#flexible-date').click();
  let draft='';win.HTMLAnchorElement.prototype.click=function(){if(this.href.startsWith('https://wa.me/'))draft=this.href;};
  doc.querySelector('#enquiry-form').requestSubmit();
  const text=draft?new URL(draft).searchParams.get('text'):'';
  const quoteNewlinesPassed=text.includes(String.fromCharCode(10)+'Name: Draft QA')&&text.includes(String.fromCharCode(10)+'Pickup: Tirupati station');
  doc.querySelector('#trip-review-details').open=true;frame.style.width='320px';await sleep(200);
  const overflow={width:doc.documentElement.scrollWidth,elements:[...doc.querySelectorAll('body *')].filter(el=>!el.closest('svg')&&el.getBoundingClientRect().right>321).slice(0,25).map(el=>({tag:el.tagName,id:el.id,className:el.className,right:el.getBoundingClientRect().right,width:el.getBoundingClientRect().width,minWidth:win.getComputedStyle(el).minWidth}))};
  document.querySelector('#results').textContent=JSON.stringify({state:'COMPLETE',passed:playbackPassed&&quoteNewlinesPassed,playbackPassed,quoteNewlinesPassed,sample,overflow},null,2);document.querySelector('#results').dataset.state='complete';
 }catch(error){document.querySelector('#results').textContent=JSON.stringify({state:'ERROR',message:String(error)});document.querySelector('#results').dataset.state='error';}
},{once:true});
</script></body></html>
